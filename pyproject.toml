[project]
name = "money-graph"
version = "0.1.0"
description = "Explainable transaction network analysis for HackAlem"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<4", "pyarrow>=18,<26", "numpy>=2,<3", "scipy>=1.14,<2",
  "networkx>=3.4,<4", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
]

[project.scripts]
money-graph = "money_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/money_graph"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs", "types-networkx"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
